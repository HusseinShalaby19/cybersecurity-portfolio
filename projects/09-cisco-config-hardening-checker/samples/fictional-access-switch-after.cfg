! Fictional "after hardening" configuration for this lab - not taken from any real device.
! Secret hashes are replaced with placeholders.
!
version 17.9
service timestamps log datetime msec localtime show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
hostname LAB-ACC-SW01
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
!
enable secret 9 <HASH-REDACTED>
username breakglass privilege 15 secret 9 <HASH-REDACTED>
!
no ip source-route
no ip http server
no ip http secure-server
no cdp run
ip ssh version 2
ip dhcp snooping
ip dhcp snooping vlan 30
login block-for 120 attempts 5 within 60
login on-failure log
login on-success log
!
ip access-list standard MGMT-ONLY
 permit 10.50.10.0 0.0.0.255
 deny any log
!
snmp-server group NMS v3 priv
snmp-server user nms-poller NMS v3 auth sha <REDACTED> priv aes 256 <REDACTED>
!
logging host 10.50.10.50
ntp server 10.50.10.1
ntp server 10.50.10.2
!
interface Vlan10
 description MGMT
 ip address 10.50.10.21 255.255.255.0
!
interface GigabitEthernet1/0/1
 description FRONT-DESK-PC-01
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/0/2
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface GigabitEthernet1/0/3
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface GigabitEthernet1/0/48
 description UPLINK-CORE
 switchport mode trunk
 ip dhcp snooping trust
!
banner login ^Authorised access only. Activity is logged.^
!
line con 0
 exec-timeout 10 0
line vty 0 4
 access-class MGMT-ONLY in
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 access-class MGMT-ONLY in
 exec-timeout 10 0
 transport input ssh
!
end
