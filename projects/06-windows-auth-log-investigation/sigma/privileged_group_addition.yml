title: Member Added to a Privileged Domain Group
id: e9f136a1-7f03-4b8b-b7e1-e8db5ede7a13
status: experimental
description: Detects a user being added to a highly privileged AD group.
author: Portfolio lab
date: 2026-10-15
references:
  - https://attack.mitre.org/techniques/T1098/
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID:
      - 4728
      - 4732
      - 4756
  selection_group:
    TargetUserName:
      - 'Domain Admins'
      - 'Enterprise Admins'
      - 'Schema Admins'
      - 'Administrators'
      - 'Account Operators'
      - 'Backup Operators'
  condition: all of selection_*
falsepositives:
  - Approved, ticketed administrative changes (verify against change records)
level: critical
