#config-version=FICTIONAL-LAB-SAMPLE
# Fictional "after remediation" configuration for comparison. Not from a real device.
config system global
    set hostname "LAB-FW-01"
    set admintimeout 10
end
config system admin
    edit "lab-admin"
        set accprofile "super_admin"
        set trusthost1 10.10.99.0 255.255.255.0
        set two-factor fortitoken
    next
end
config system interface
    edit "port1"
        set ip 203.0.113.2 255.255.255.248
        set allowaccess ping
        set role wan
    next
    edit "port2"
        set ip 10.10.20.1 255.255.255.0
        set role lan
    next
    edit "port9"
        set ip 10.10.99.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
    next
end
config firewall policy
    edit 1
        set name "Staff-to-Internet-Web"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "STAFF-NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS"
        set utm-status enable
        set logtraffic all
        set comments "Owner: IT. Ticket: CHG-0001. Review: quarterly."
        set nat enable
    next
    edit 2
        set name "Vendor-SSL-VPN-to-App"
        set srcintf "ssl.root"
        set dstintf "port2"
        set srcaddr "VPN-VENDOR-POOL"
        set dstaddr "APP-SRV"
        set action accept
        set schedule "VENDOR-WINDOW-ONE-TIME"
        set service "RDP"
        set logtraffic all
        set comments "MFA-enforced vendor access, expires with schedule."
    next
end
