#config-version=FICTIONAL-LAB-SAMPLE
# Fictional configuration written for this lab. It does not come from any real
# device or customer. Addresses use RFC 1918 and RFC 5737 documentation ranges.
# Intentionally contains weaknesses so the auditor has something to find.
config system global
    set hostname "LAB-FW-01"
    set admintimeout 60
    set admin-https-redirect disable
end
config system admin
    edit "lab-admin"
        set accprofile "super_admin"
    next
    edit "lab-readonly"
        set accprofile "prof_admin"
        set trusthost1 10.10.99.0 255.255.255.0
        set two-factor fortitoken
    next
end
config system interface
    edit "port1"
        set ip 203.0.113.2 255.255.255.248
        set allowaccess ping https ssh http
        set role wan
    next
    edit "port2"
        set ip 10.10.20.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
    next
    edit "port3"
        set ip 10.10.60.1 255.255.255.0
        set allowaccess ping
        set role lan
    next
end
config firewall policy
    edit 1
        set name "Staff-to-Internet"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "Inbound-RDP-temp-vendor"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "VIP-APP-SRV"
        set action accept
        set schedule "always"
        set service "RDP"
        set logtraffic disable
    next
    edit 3
        set name "Guest-to-Internet"
        set srcintf "port3"
        set dstintf "port1"
        set srcaddr "GUEST-NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set utm-status enable
        set nat enable
    next
    edit 4
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 5
        set name "Staff-FTP-to-Internet"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "STAFF-NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "FTP"
    next
    edit 6
        set name "Old-migration-rule"
        set status disable
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
